{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4 arcade-card text-center">
        <h2 class="text-warning mb-4">Login to Play</h2>
        
        <form action="{{ url_for('login') }}" method="post" class="text-start">
            <div class="mb-3">
                <label class="form-label text-muted small">USERNAME</label>
                <input type="text" name="username" class="form-control key-input" placeholder="Enter username" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-muted small">PASSWORD</label>
                <input type="password" name="password" class="form-control key-input" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-warning w-100 mt-3">
                <strong>INITIALIZE_GAME</strong>
            </button>
        </form>
        
        <div class="mt-4">
            <p class="text-muted small">New recruit? <a href="{{ url_for('register') }}" class="text-warning">Register_here</a></p>
        </div>
    </div>
</div>

<div class="text-center mt-5">
    <img src="{{ url_for('static', filename='images/ninja_karate.gif') }}" style="width: 80px; opacity: 0.6;">
</div>
{% endblock %}

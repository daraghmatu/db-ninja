{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4 arcade-card p-5">
        <h2 class="text-center mb-4 text-warning">Player Registration</h2>
        
        <form method="POST">
            <div class="mb-3">
                <label class="form-label text-warning">ENROLLMENT PIN</label>
                <input type="text" name="pin" class="form-control key-input" placeholder="Enter PIN" required>
            </div>

            <div class="mb-3">
                <label class="form-label text-warning">CHOOSE USERNAME</label>
                <input type="text" name="username" class="form-control key-input" placeholder="Ninja name" required>
            </div>

            <div class="mb-3">
                <label class="form-label text-warning">CREATE PASSWORD</label>
                <input type="password" name="password" class="form-control key-input" placeholder="Secret code" required>
            </div>

            <button type="submit" class="btn btn-warning w-100 mt-3">
                <strong>CREATE ACCOUNT</strong>
            </button>
        </form>

        <div class="mt-4 text-center">
            <p>Already have an account? <br>
                <a href="{{ url_for('login') }}" class="text-warning" style="text-decoration: underline;">Login here</a>
            </p>
        </div>
    </div>
</div>

<div class="text-center mt-5">
    <img src="{{ url_for('static', filename='images/ninja_karate.gif') }}" style="width: 80px; opacity: 0.6;">
</div>
{% endblock %}

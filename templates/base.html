<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB NINJA ACADEMY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: 'Courier New', monospace; 
            padding-top: 120px;
        }
        .navbar-arcade {
            background-color: #161b22;
            border-bottom: 2px solid #30363d;
        }
        .arcade-card { 
            background: #161b22; 
            border: 2px solid #30363d; 
            border-radius: 10px; 
            padding: 30px;
        }
        .text-warning { color: #f1e05a !important; }
        .key-input { 
            background-color: #0d1117 !important; 
            color: #f1e05a !important; 
            border: 1px solid #30363d !important;
        }
        .key-input::placeholder { color: #72767d !important; }
        
        .system-alerts {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            width: 90%;
            max-width: 500px;
        }

        .alert-arcade {
            background-color: #161b22 !important;
            border: 2px solid #f1e05a !important;
            color: #f1e05a !important;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8), 0 0 10px rgba(241, 224, 90, 0.2);
            border-radius: 8px;
        }

        .btn-close-white {
            filter: invert(1) grayscale(100%) brightness(200%);
        }

        .form-label { 
            color: #f1e05a !important;
            font-size: 0.8rem;
            letter-spacing: 1px;
            margin-bottom: 5px;
            display: block;
        }

        .text-muted { 
            color: #b9bbbe !important;
        }

        p {
            color: #c9d1d9 !important;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-arcade fixed-top">
        <div class="container">
            <a class="navbar-brand text-warning" href="/"><strong>DB NINJA</strong></a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText">
                <span class="navbar-toggler-icon"></span>
            </button>
    
            <div class="collapse navbar-collapse" id="navbarText">
                <ul class="navbar-nav ms-auto">
                    {% if session.get('user_id') %}
                        <li class="nav-item">
                            <a class="nav-link text-danger border border-danger rounded px-2" href="{{ url_for('logout') }}">LOGOUT</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <div class="system-alerts">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-dark border-warning text-warning alert-dismissible fade show" role="alert">
                <strong>> SYSTEM:</strong> {{ message }}
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
    </div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

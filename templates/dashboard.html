{% extends "base.html" %}
{% block content %}
<div class="container mt-5 text-center">
    <h2>Konnichiwa {{ username }}</h2>
    <p>Current Rank: Level {{ user_level }}</p>
    <hr>
    
    <div class="row">
        {% for l in levels %}
        <div class="col-md-4 col-lg-3 mb-4">
            <div class="card h-100 {{ 'shadow-sm' if l.is_available else 'opacity-75 bg-light' }}">
                <div class="card-body text-center">
                    <h5 class="card-title">{{ l.name }}</h5>
                    
                    {% if l.is_available %}
                        {% if l.level_id <= user_level %}
                            <a href="{{ url_for('game', level_id=l.level_id) }}" class="btn btn-primary w-100">Play Level</a>
                        {% else %}
                            <button class="btn btn-outline-secondary w-100" disabled>Complete Level {{ l.level_id - 1 }} First</button>
                        {% endif %}
                    {% else %}
                        <button class="btn btn-dark w-100" disabled>Locked 🔒</button>
                    {% endif %}
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
